[tool.poetry]
name = "ibgateway"
version = "0.1.0"
description = "IB Gateway Docker Image with noVNC and Screenshot Support"
authors = ["Your Name <you@example.com>"]
readme = "README.md"
packages = [{include = "ibgateway_manager"}]

[tool.poetry.dependencies]
python = "^3.10"
python-dotenv = ">=1.0.0"
Pillow = ">=10.0.0"
debugpy = ">=1.6.0"
mcp = ">=1.9.0"
numpy = {version = ">=1.24.0", optional = true}
# Match ibkr_core: fork tracks IBKR stable builds; avoids PyPI ibapi + protobuf pin conflicts.
ibapi = { git = "https://github.com/saltzmanjoelh/ibapi.git", tag = "stable-10.45" }
protobuf = ">=5.29.5,<6"

[tool.poetry.extras]
full = ["numpy"]

[tool.poetry.scripts]
ibgateway-cli = "ibgateway_manager.cli:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
